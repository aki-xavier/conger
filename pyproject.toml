[project]
name = "conger"
version = "0.1.0"
description = "SPN 逆渲染研究: 立体二维图像 → Riesz 特征 → 完整 cga.Scene 重建"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "mlx>=0.32.0",
    "cga",  # 独立项目 ~/code/cga (path source, 见 [tool.uv.sources])
    "numpy>=2.4.6",
    "pillow>=12.3.0",
]

[tool.uv.sources]
cga = { path = "../cga", editable = true }

# ═══════════════════════════════════════════════════════════════════════
# ruff — linter & formatter
# ═══════════════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# ═══════════════════════════════════════════════════════════════════════
# pyright — static type checker (used by VS Code Pylance)
# ═══════════════════════════════════════════════════════════════════════
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportOptionalOperand = false
reportOptionalMemberAccess = false
reportUnusedVariable = false
reportUnknownLambdaType = false
reportMissingParameterType = false
reportArgumentType = false
reportMissingTypeArgument = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# ═══════════════════════════════════════════════════════════════════════
# pytest — 测试 (tests/, src 经 pythonpath 入径)
# ═══════════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# slow = 渲染管线集成自检 (含候选渲染精炼, 分钟级)。默认跳过, pytest -m slow 跑
addopts = "-m 'not slow'"
markers = ["slow: 渲染管线集成自检 (inverse quick 全流程)"]
